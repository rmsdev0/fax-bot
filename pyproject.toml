[project]
name = "fax-bot"
version = "0.1.0"
description = "Fax-a-Chatbot: the world's slowest chatbot (Telnyx Programmable Fax + Claude)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pynacl>=1.5",
    "pymupdf>=1.24",
    "anthropic>=0.120.2",
    "jinja2>=3.1.6",
    "playwright>=1.62.0",
    "pillow>=12.3.0",
    "sentry-sdk>=2.66.1",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
