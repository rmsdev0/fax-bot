name: ci

# push covers main; pull_request covers branches — no double runs per PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks reads the PR's commit list on pull_request events
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manual full round trip against the live number (sends a real fax; costs
  # real cents). Requires TELNYX_* and server secrets configured in the repo.
  # Left as a manual trigger so CI never surprises the phone bill.
  # round-trip:
  #   if: github.event_name == 'workflow_dispatch'
  #   ...
