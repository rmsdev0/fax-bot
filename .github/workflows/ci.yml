name: ci

# push covers main; pull_request covers branches — no double runs per PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks reads the PR's commit list on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manual full round trip against the live number (sends a real fax; costs
  # real cents). Requires TELNYX_* and server secrets configured in the repo.
  # Left as a manual trigger so CI never surprises the phone bill.
  # round-trip:
  #   if: github.event_name == 'workflow_dispatch'
  #   ...
