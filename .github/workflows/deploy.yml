name: deploy

# Requires two repository variables (Settings -> Secrets and variables ->
# Actions -> Variables):
#   AWS_ROLE_ARN — the fax-bot-ci role created by infra/ci.tf
#   ECR_REPO     — the repository URL from `terraform output ecr_repository_url`

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "alembic.ini"
      - "Dockerfile"
      - "start.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPO: ${{ vars.ECR_REPO }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push
        run: |
          docker build -t "$ECR_REPO:latest" -t "$ECR_REPO:${GITHUB_SHA::12}" .
          docker push "$ECR_REPO:latest"
          docker push "$ECR_REPO:${GITHUB_SHA::12}"

      - name: Roll the service
        run: |
          aws ecs update-service --cluster fax-bot --service fax-bot \
            --force-new-deployment --query "service.serviceName" --output text
